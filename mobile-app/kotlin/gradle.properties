android.useAndroidX=true
android.enableJetifier=true
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+UseG1GC
kotlin.daemon.jvm.options=-Xmx2048m
kotlin.native.ignoreDisabledTargets=true

# Enable Gradle Parallel Execution for multi-project builds
org.gradle.parallel=true

# Enable Gradle Build Cache to speed up consecutive builds
org.gradle.caching=true

# Enable Kotlin Incremental Compilation for faster development loops
kotlin.incremental=true
